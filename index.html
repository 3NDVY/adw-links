<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AD.W — Links</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 20% 20%, #252525 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #151515 0%, transparent 35%),
        #050505;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 40px 22px;
      text-align: center;
    }

    .profile {
      margin-bottom: 30px;
      animation: fadeDown 0.8s ease;
    }

    .avatar {
      width: 95px;
      height: 95px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;

      background: linear-gradient(135deg, #ffffff, #777);
      color: #050505;

      box-shadow:
        0 0 20px rgba(255,255,255,.18),
        0 0 60px rgba(255,255,255,.05);
    }

    h1 {
      margin-top: 18px;
      font-size: 28px;
      letter-spacing: 3px;
    }

    .username {
      margin-top: 8px;
      color: #999;
      font-size: 14px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 15px 20px;

      color: white;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: .5px;

      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;

      backdrop-filter: blur(10px);

      transition: .3s ease;
      animation: fadeUp .7s ease both;
    }

    .link:nth-child(2) {
      animation-delay: .1s;
    }

    .link:nth-child(3) {
      animation-delay: .2s;
    }

    .link:hover {
      transform: translateY(-4px) scale(1.02);
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.3);

      box-shadow: 0 10px 35px rgba(255,255,255,.08);
    }

    .icon {
      margin-right: 10px;
      font-size: 20px;
    }

    footer {
      margin-top: 30px;
      color: #555;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="profile">
      <div class="avatar">AD</div>

      <h1>AD.W</h1>
      <p class="username">@xad.wx</p>
    </section>

    <section class="links">

      <a
        class="link"
        href="https://www.instagram.com/xad.wx"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">📸</span>
        Instagram
      </a>

      <a
        class="link"
        href="https://www.tiktok.com/@end.vy"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">♪</span>
        TikTok
      </a>

      <a
        class="link"
        href="https://saweria.co/KrAdiNa"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">☕</span>
        Saweria
      </a>

    </section>

    <footer>
      © 2026 AD.W
    </footer>

  </main>

</body>
</html>
