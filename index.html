<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="AD.W — Personal Links">
  <title>AD.W — Pixel World</title>

  <!-- Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --panel: #101010;
      --white: #ffffff;
      --gray: #aaaaaa;
      --dim: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      padding: 40px 18px 75px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;

      color: var(--white);
      background:
        radial-gradient(ellipse at 50% 30%, #242424 0%, transparent 55%),
        #050505;

      font-family: 'Press Start 2P', monospace;
    }

    /* PIXEL BACKGROUND */

    .pixel-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .pixel-background::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(circle, #fff 1px, transparent 1.5px),
        radial-gradient(circle, #777 1px, transparent 1.5px);

      background-size: 83px 91px, 127px 113px;
      background-position: 10px 15px, 48px 60px;
      opacity: .35;

      animation: starMove 18s linear infinite;
    }

    .pixel-background::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          transparent 96%,
          rgba(255,255,255,.035) 96%
        );

      background-size: 100% 5px;
      opacity: .25;
    }

    /* MAIN CARD */

    .container {
      width: 100%;
      max-width: 410px;
      position: relative;
      z-index: 1;
      text-align: center;

      padding: 30px 22px;
      background: rgba(5, 5, 5, .82);

      border: 2px solid #777;
      box-shadow:
        6px 6px 0 #333,
        12px 12px 0 rgba(255,255,255,.035);

      animation: appear .8s ease both;
    }

    .game-label {
      display: inline-block;
      padding: 10px 8px;
      margin-bottom: 36px;

      border: 2px solid var(--white);
      background: #111;

      font-size: 8px;
      line-height: 1.8;
      letter-spacing: 1px;

      box-shadow: 4px 4px 0 #555;
    }

    .game-label span {
      animation: blink 1.2s steps(2, start) infinite;
    }

    /* PROFILE AVATAR */

    .avatar-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;

      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;

      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 45deg,
        #fff 100deg,
        #777 125deg,
        transparent 160deg,
        transparent 360deg
      );

      animation: rotateRing 3s linear infinite;

      filter: drop-shadow(0 0 8px #fff);
    }

    .avatar-ring::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--bg);
    }

    .avatar {
      width: 108px;
      height: 108px;

      position: relative;
      z-index: 2;

      display: block;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid white;

      box-shadow:
        0 0 12px #fff7,
        0 0 30px #fff2;

      animation: profilePulse 3s ease-in-out infinite;

      transition: filter .25s ease;
    }

    .avatar:hover {
      filter: grayscale(100%) brightness(1.15);
    }

    h1 {
      font-size: clamp(21px, 6vw, 27px);
      letter-spacing: 2px;
      line-height: 1.6;
      margin-bottom: 14px;

      text-shadow:
        3px 3px 0 #555,
        0 0 16px #ffffff40;
    }

    .username {
      color: var(--gray);
      font-size: 10px;
      line-height: 2;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #777;
      font-size: 8px;
      line-height: 2.2;
      margin-bottom: 34px;
    }

    /* SOCIAL LINKS */

    .links {
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .link {
      min-height: 62px;
      padding: 16px 12px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;

      background: linear-gradient(135deg, #191919, #080808);
      color: var(--white);
      text-decoration: none;

      border: 2px solid #888;
      box-shadow: 5px 5px 0 #444;

      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      line-height: 1.8;

      transition:
        transform .15s steps(3),
        box-shadow .15s steps(3),
        background .15s;

      animation: slideUp .7s ease both;
    }

    .link:nth-child(2) {
      animation-delay: .12s;
    }

    .link:nth-child(3) {
      animation-delay: .24s;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .icon {
      font-size: 17px;
      min-width: 20px;
    }

    .arrow {
      color: #aaa;
      font-size: 12px;
    }

    .link:hover,
    .link:focus-visible {
      background: #292929;
      transform: translate(4px, 4px);
      box-shadow: 1px 1px 0 #444;
      border-color: #fff;
      outline: none;
    }

    .link:active {
      transform: translate(5px, 5px);
      box-shadow: none;
    }

    /* FOOTER */

    footer {
      margin-top: 34px;
      padding-top: 20px;
      border-top: 1px dashed #444;

      color: #777;
      font-size: 8px;
      line-height: 2.5;
    }

    .pixel-divider {
      color: #fff;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    .footer-small {
      color: #555;
    }

    /* DORO WALKING */

    .doro {
      position: fixed;
      width: 90px;
      height: auto;

      right: -110px;
      bottom: 5px;

      z-index: 5;
      pointer-events: none;

      image-rendering: auto;
      animation: doroWalk 14s linear infinite;
    }

    /* ANIMATIONS */

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes profilePulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 12px #fff7, 0 0 30px #fff2;
      }

      50% {
        transform: scale(1.045);
        box-shadow: 0 0 22px #fff9, 0 0 48px #fff3;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      50% { opacity: .3; }
    }

    @keyframes starMove {
      from { background-position: 10px 15px, 48px 60px; }
      to   { background-position: 10px 195px, 48px 240px; }
    }

    @keyframes doroWalk {
      from { right: -110px; }
      to   { right: calc(100% + 110px); }
    }

    /* RESPONSIVE */

    @media (max-width: 480px) {
      body {
        padding: 28px 16px 65px;
        align-items: center;
      }

      .container {
        max-width: 360px;
        padding: 27px 18px;
      }

      .game-label {
        margin-bottom: 32px;
      }

      .avatar-wrapper {
        width: 112px;
        height: 112px;
      }

      .avatar {
        width: 100px;
        height: 100px;
      }

      .link {
        min-height: 58px;
        font-size: 8px;
      }

      .doro {
        width: 72px;
        bottom: 3px;
      }
    }

    /* ACCESSIBILITY */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="pixel-background" aria-hidden="true"></div>

  <main class="container">

    </div>

      <h1>AD.W</h1>

    <nav class="links" aria-label="Social media">

    </nav>

    <!-- FOOTER -->
    <footer>
      <div class="pixel-divider">■ ■ ■ ■ ■</div>

    </footer>

  </main>

  <!-- DORO ANIMATION -->
  <img
    class="doro"
    src="doro_bawa_kresek_transparan.gif"

    aria-hidden="true"
  >

</body>
</html>
